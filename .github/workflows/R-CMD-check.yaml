name: Fedora-Intel-reference-check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub runner exposing Cascade Lake AVX-512 and VNNI
        default: ubuntu-24.04
        required: true
        type: string
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ${{ inputs.runner || vars.TIDYONNX_REFERENCE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Run Intel reference validation inside latest Fedora and R
        run: sh tools/run_fedora_tests.sh
      - name: Retain environment provenance and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-intel-validation
          path: validation-results/fedora/
          if-no-files-found: warn
