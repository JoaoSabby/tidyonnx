name: Fedora-Docker-check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run every validation inside the latest Fedora and R container
        run: sh tools/run_fedora_tests.sh
      - name: Retain environment provenance and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-validation
          path: validation-results/fedora/
          if-no-files-found: warn
